<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body><div style="display: flex; justify-content: center; align-items: center; padding: 20px; background: #0d1117; border-radius: 12px; max-width: 250px; margin: auto;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
            <defs>
                <!-- Efek Glow / Neon untuk Mata -->
                <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
                    <fegaussianblur stdDeviation="4" result="blur"></fegaussianblur>
                    <fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
                </filter>
                
                <!-- Animasi Mata Berkedip & Menyala -->
                <style>
                    @keyframes blink {
                        0%, 90%, 100% { transform: scaleY(1); }
                        95% { transform: scaleY(0.1); }
                    }
                    @keyframes pulse {
                        0%, 100% { opacity: 0.8; }
                        50% { opacity: 1; filter: drop-shadow(0 0 8px #00ffcc); }
                    }
                    .robot-eye {
                        transform-origin: center;
                        animation: blink 4s infinite ease-in-out;
                    }
                    .neon-part {
                        animation: pulse 2s infinite ease-in-out;
                    }
                </style>
            </defs>

            <!-- 1. Antena / Sensor Atas -->
            <rect x="95" y="15" width="10" height="25" rx="5" fill="#4a5568"></rect>
            <circle cx="100" cy="15" r="8" fill="#00ffcc" class="neon-part" filter="url(#neon-glow)"></circle>

            <!-- 2. Telinga / Samping Kepala -->
            <rect x="25" y="75" width="15" height="50" rx="6" fill="#2d3748"></rect>
            <rect x="160" y="75" width="15" height="50" rx="6" fill="#2d3748"></rect>

            <!-- 3. Struktur Utama Kepala -->
            <rect x="35" y="40" width="130" height="120" rx="28" fill="#1a202c" stroke="#4a5568" stroke-width="4"></rect>
            
            <!-- Plat Dahi (Aksen Desain) -->
            <path d="M 60 40 L 140 40 L 130 65 L 70 65 Z" fill="#2d3748"></path>

            <!-- 4. Area Mata (Screen) -->
            <rect x="50" y="75" width="100" height="45" rx="12" fill="#0f172a" stroke="#2d3748" stroke-width="2"></rect>

            <!-- 5. Mata Robot (Animasi) -->
            <ellipse class="robot-eye" cx="75" cy="97" rx="10" ry="10" fill="#00ffcc" filter="url(#neon-glow)"></ellipse>
            <ellipse class="robot-eye" cx="125" cy="97" rx="10" ry="10" fill="#00ffcc" filter="url(#neon-glow)"></ellipse>

            <!-- 6. Komponen Mulut / Kisi Udara -->
            <g fill="#4a5568">
                <rect x="75" y="135" width="6" height="12" rx="2"></rect>
                <rect x="87" y="135" width="6" height="16" rx="2"></rect>
                <rect x="99" y="135" width="6" height="16" rx="2"></rect>
                <rect x="111" y="135" width="6" height="16" rx="2"></rect>
                <rect x="123" y="135" width="6" height="12" rx="2"></rect>
            </g>
        </svg>
    </div>
    </body></html>
